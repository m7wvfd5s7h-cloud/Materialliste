<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Materialliste">
<title>Materialliste Installation</title>
<style>
:root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#171717; background:#f4f5f6; }
* { box-sizing:border-box; }
body { margin:0; background:#f4f5f6; }
.app { max-width:1100px; margin:auto; padding:12px 12px 100px; }
.header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
h1 { font-size:25px; margin:0; }
.total { background:white; border:1px solid #d8dadd; border-radius:12px; padding:10px 14px; font-weight:800; }
input { font:inherit; }
.field { width:100%; min-height:48px; padding:11px 12px; border:1px solid #d2d5d8; border-radius:12px; background:white; margin-bottom:8px; }
.monteure { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.monteur { display:grid; grid-template-columns:1fr 76px; gap:6px; }
.categorybar { display:flex; gap:7px; overflow-x:auto; padding:8px 0; position:sticky; top:0; z-index:20; background:#f4f5f6; }
.categorybar::-webkit-scrollbar { display:none; }
.cat { flex:0 0 auto; border:1px solid #cdd1d5; background:#fff; border-radius:11px; padding:12px 14px; min-height:48px; font-weight:700; }
.cat.active { background:#171717; color:white; border-color:#171717; }
.items { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.item { background:white; border:1px solid #ddd; border-radius:14px; padding:12px; min-height:125px; display:flex; flex-direction:column; justify-content:space-between; }
.item.selected { outline:3px solid #171717; }
.name { font-weight:750; font-size:16px; }
.meta { font-size:12px; opacity:.6; margin-top:4px; }
.controls { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
.minus,.plus { min-height:48px; border-radius:11px; touch-action:manipulation; }
.minus { width:48px; border:1px solid #d2d5d8; background:#fff; font-size:24px; }
.plus { width:58px; border:0; background:#171717; color:white; font-size:30px; }
.qty { font-size:21px; font-weight:800; }
.custom { margin-top:18px; background:white; border:2px solid #cfd2d6; border-radius:14px; padding:12px; }
.custom summary { list-style:none; cursor:pointer; font-size:18px; font-weight:800; display:flex; justify-content:space-between; padding:2px 0 8px; }
.custom summary::-webkit-details-marker { display:none; }
.customrow { display:grid; grid-template-columns:minmax(0,1fr) 72px 44px; gap:6px; margin-top:7px; }
.customrow input { min-height:42px; padding:8px; border:1px solid #d2d5d8; border-radius:9px; background:white; }
.customrow button { border:1px solid #d2d5d8; border-radius:9px; background:white; font-size:18px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; position:sticky; bottom:8px; z-index:30; background:rgba(244,245,246,.96); padding:8px; border-radius:14px; }
.action { flex:1 1 45%; min-height:50px; border:1px solid #d2d5d8; background:white; border-radius:11px; font-weight:750; }
.search { margin-top:4px; }
.empty { background:white; padding:30px; border-radius:14px; text-align:center; opacity:.65; }
@media(max-width:600px) {
  .items { grid-template-columns:1fr; }
  .monteure { grid-template-columns:1fr; }
}
</style>
<style>
.savedModal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;padding:20px;display:flex;align-items:flex-end}
.savedPanel{width:100%;max-width:700px;margin:auto;background:white;border-radius:16px;padding:14px;max-height:80vh;overflow:auto}
.savedHead{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:10px}
.savedHead button{border:0;background:transparent;font-size:30px;line-height:1}
.savedEntry{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:10px;margin:7px 0}
.savedEntry button{min-height:42px;border:1px solid #d2d5d8;background:white;border-radius:9px;padding:7px 10px;font-weight:700}
.savedEmpty{opacity:.6;padding:15px 0;text-align:center}
</style></head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Materialliste Installation</h1><div style="opacity:.65;font-size:13px">Artikel antippen oder mit Pencil auswählen</div></div>
    <div class="total" id="total">0 Stück</div>
  </div>

  <input class="field" id="customer" placeholder="Kundenname eingeben …">
  <div class="monteure">
    <div class="monteur"><input class="field" id="m1n" placeholder="Monteur 1"><input class="field" id="m1h" placeholder="Std."></div>
    <div class="monteur"><input class="field" id="m2n" placeholder="Monteur 2"><input class="field" id="m2h" placeholder="Std."></div>
    <div class="monteur"><input class="field" id="m3n" placeholder="Monteur 3"><input class="field" id="m3h" placeholder="Std."></div>
    <div class="monteur"><input class="field" id="m4n" placeholder="Monteur 4"><input class="field" id="m4h" placeholder="Std."></div>
  </div>

  <input class="field search" id="search" type="search" placeholder="Artikel suchen …">
  <div class="categorybar" id="categories"></div>
  <div class="items" id="items"></div>

  <details class="custom" id="customDetails" open>
    <summary><span>Eigenes Material</span><span id="customArrow">▲</span></summary>
    <div id="customRows"></div>
  </details>

  <div class="actions">
    <button class="action" id="save">Liste speichern</button>
<button class="action" id="openSaved">Gespeicherte Listen</button>
    <button class="action" id="finish">Liste abschließen</button>
    <button class="action" id="new">Neue Liste</button>
    <button class="action" id="clear">Auswahl löschen</button>
  </div>
  <div id="savedModal" class="savedModal" hidden>
    <div class="savedPanel">
      <div class="savedHead"><strong>Gespeicherte Listen</strong><button type="button" id="closeSaved">×</button></div>
      <div id="savedList"></div>
    </div>
  </div>
</div>

const categories = Object.keys(data);
let active = categories[0];
let quantities = {};

const el = id => document.getElementById(id);

function saveState() {
  try { localStorage.setItem("materialliste_quantities", JSON.stringify(quantities)); }
  catch(e) {}
}
function loadState() {
  try { quantities = JSON.parse(localStorage.getItem("materialliste_quantities") || "{}") || {}; }
  catch(e) { quantities = {}; }
}
function total() {
  return Object.values(quantities).reduce((a,b) => a + Number(b || 0), 0);
}
function renderCategories() {
  const box = el("categories");
  box.innerHTML = "";
  categories.forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat" + (cat === active ? " active" : "");
    b.textContent = cat;
    b.onclick = () => {
      active = cat;
      el("search").value = "";
      renderCategories();
      renderItems();
    };
    box.appendChild(b);
  });
}
function renderItems() {
  const box = el("items");
  box.innerHTML = "";
  const term = el("search").value.trim().toLowerCase();
  const rows = data[active].map((x,i) => [x,i]).filter(r => !term || r[0].join(" ").toLowerCase().includes(term));
  if (!rows.length) {
    box.innerHTML = '<div class="empty">Keine passenden Artikel gefunden.</div>';
    return;
  }
  rows.forEach(([x,i]) => {
    const key = active + "|" + i;
    const card = document.createElement("div");
    card.className = "item" + (quantities[key] ? " selected" : "");

    const top = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = x[0];
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = x[1] + " · Art.-Nr. " + x[2];
    top.append(name, meta);

    const controls = document.createElement("div");
    controls.className = "controls";

    const minus = document.createElement("button");
    minus.type = "button";
    minus.className = "minus";
    minus.textContent = "−";

    const q = document.createElement("div");
    q.className = "qty";
    q.textContent = quantities[key] || 0;

    const plus = document.createElement("button");
    plus.type = "button";
    plus.className = "plus";
    plus.textContent = "+";

    const update = delta => {
      quantities[key] = Math.max(0, (quantities[key] || 0) + delta);
      if (!quantities[key]) delete quantities[key];
      saveState();
      renderItems();
      el("total").textContent = total() + " Stück";
    };

    minus.onclick = e => { e.stopPropagation(); update(-1); };
    plus.onclick = e => { e.stopPropagation(); update(1); };
    card.onclick = () => update(1);

    controls.append(minus, q, plus);
    card.append(top, controls);
    box.appendChild(card);
  });
  el("total").textContent = total() + " Stück";
}
function renderCustom() {
  const box = el("customRows");
  box.innerHTML = "";
  let rows = [];
  try { rows = JSON.parse(localStorage.getItem("materialliste_custom") || "[]") || []; } catch(e) {}
  while (rows.length < 15) rows.push({name:"", qty:""});
  rows = rows.slice(0,15);

  rows.forEach((r,i) => {
    const row = document.createElement("div");
    row.className = "customrow";
    const name = document.createElement("input");
    name.placeholder = "Material / Bezeichnung";
    name.value = r.name || "";
    const qty = document.createElement("input");
    qty.placeholder = "Menge";
    qty.inputMode = "numeric";
    qty.value = r.qty || "";
    const clear = document.createElement("button");
    clear.type = "button";
    clear.textContent = "×";

    const persist = () => localStorage.setItem("materialliste_custom", JSON.stringify(rows));
    name.oninput = () => { rows[i].name = name.value; persist(); };
    qty.oninput = () => { rows[i].qty = qty.value; persist(); };
    clear.onclick = () => { rows[i] = {name:"",qty:""}; persist(); renderCustom(); };
    row.append(name, qty, clear);
    box.appendChild(row);
  });
}
el("search").addEventListener("input", renderItems);
el("customDetails").addEventListener("toggle", () => {
  el("customArrow").textContent = el("customDetails").open ? "▲" : "▼";
});
["customer","m1n","m1h","m2n","m2h","m3n","m3h","m4n","m4h"].forEach(id => {
  const v = localStorage.getItem("materialliste_" + id) || "";
  el(id).value = v;
  el(id).addEventListener("input", () => localStorage.setItem("materialliste_" + id, el(id).value));
});
el("clear").onclick = () => { quantities = {}; saveState(); renderItems(); };
el("new").onclick = () => { quantities = {}; saveState(); renderItems(); };
function collectListState(){
  const custom = localStorage.getItem("materialliste_custom") || "[]";
  const fields = {};
  ["customer","m1n","m1h","m2n","m2h","m3n","m3h","m4n","m4h"].forEach(id => {
    fields[id] = el(id).value || "";
  });
  return {quantities: JSON.parse(JSON.stringify(quantities)), custom: custom, fields: fields};
}
function restoreListState(state){
  quantities = state.quantities || {};
  if(state.fields) Object.keys(state.fields).forEach(id => { if(el(id)) el(id).value = state.fields[id] || ""; });
  localStorage.setItem("materialliste_custom", state.custom || "[]");
  saveState(); renderItems(); renderCustom();
}
function getSavedLists(){
  try { return JSON.parse(localStorage.getItem("materialliste_saved") || "[]") || []; } catch(e) { return []; }
}
function setSavedLists(list){ localStorage.setItem("materialliste_saved", JSON.stringify(list)); }
function renderSavedLists(){
  const box=el("savedList"); box.innerHTML="";
  const list=getSavedLists();
  if(!list.length){box.innerHTML='<div class="savedEmpty">Noch keine Listen gespeichert.</div>';return;}
  list.forEach((entry,i)=>{
    const row=document.createElement("div"); row.className="savedEntry";
    const info=document.createElement("div");
    info.innerHTML="<strong>"+entry.name+"</strong><br><span style='opacity:.65;font-size:13px'>"+entry.date+"</span>";
    const open=document.createElement("button"); open.type="button"; open.textContent="Öffnen";
    const del=document.createElement("button"); del.type="button"; del.textContent="Löschen";
    open.onclick=()=>{restoreListState(entry.state);el("savedModal").hidden=true;};
    del.onclick=()=>{list.splice(i,1);setSavedLists(list);renderSavedLists();};
    row.append(info,open,del);box.appendChild(row);
  });
}
el("save").onclick=()=>{
  const list=getSavedLists();
  const customer=el("customer").value.trim();
  const name=customer || "Liste "+(list.length+1);
  list.unshift({name:name,date:new Date().toLocaleString("de-DE"),state:collectListState()});
  setSavedLists(list); alert("Liste gespeichert."); 
};
el("openSaved").onclick=()=>{renderSavedLists();el("savedModal").hidden=false;};
el("closeSaved").onclick=()=>{el("savedModal").hidden=true;};
el("savedModal").addEventListener("click",e=>{if(e.target===el("savedModal"))el("savedModal").hidden=true;});
el("finish").onclick = () => { alert("Liste abgeschlossen."); saveState(); };

loadState();
renderCategories();
renderItems();
renderCustom();
</script>
</body>
