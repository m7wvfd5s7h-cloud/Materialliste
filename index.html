<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Materialliste">
<title>Materialliste – Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}
main{max-width:700px;margin:auto;padding:16px}
h1{font-size:26px;margin:0 0 6px}.note{font-size:14px;opacity:.65;margin-bottom:14px}
.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin-bottom:12px}
label.title{display:block;font-weight:700;margin-bottom:6px}
input{font:inherit;min-height:52px;border:1px solid #cfd2d6;border-radius:12px;padding:10px 12px;background:#fff}
.customer{width:100%}
h2{font-size:20px;margin:0 0 10px}
.crew{display:grid;gap:8px}
.row{display:grid;grid-template-columns:100px 1fr 90px;gap:7px;align-items:center}
.row b{font-size:15px}.hours{width:100%}
.material{display:flex;justify-content:space-between;align-items:center;gap:12px}
.article{font-weight:750;font-size:18px}.small{font-size:13px;opacity:.6;margin-top:3px}
.controls{display:flex;align-items:center;gap:9px}
button{width:54px;height:52px;border:1px solid #cfd2d6;border-radius:12px;background:#fff;font-size:27px;font-weight:700;touch-action:manipulation}
.plus{background:#171717;color:#fff;border-color:#171717}.number{min-width:35px;text-align:center;font-size:22px;font-weight:800}
.status{font-weight:700;text-align:center;min-height:24px}
@media(max-width:560px){.row{grid-template-columns:85px 1fr 78px}}
</style>
</head>
<body>
<main>
<h1>Materialliste – Testversion</h1>
<div class="note">Wir testen zuerst nur Eingaben und − / +. Wenn das funktioniert, bauen wir die komplette Materialliste.</div>

<section class="panel">
<label class="title" for="customer">Kundenname</label>
<input id="customer" class="customer" type="text" placeholder="Kundenname eingeben">
</section>

<section class="panel">
<h2>Monteure</h2>
<div class="crew">
<div class="row"><b>Monteur 1</b><input type="text" placeholder="Name"><input class="hours" type="number" inputmode="decimal" step="0.25" min="0" placeholder="Std."></div>
<div class="row"><b>Monteur 2</b><input type="text" placeholder="Name"><input class="hours" type="number" inputmode="decimal" step="0.25" min="0" placeholder="Std."></div>
<div class="row"><b>Monteur 3</b><input type="text" placeholder="Name"><input class="hours" type="number" inputmode="decimal" step="0.25" min="0" placeholder="Std."></div>
<div class="row"><b>Monteur 4</b><input type="text" placeholder="Name"><input class="hours" type="number" inputmode="decimal" step="0.25" min="0" placeholder="Std."></div>
</div>
</section>

<section class="panel">
<h2>Testartikel</h2>
<div class="material">
<div><div class="article">Sanpress Bogen 22 mm</div><div class="small">Bitte nur die Menge testen.</div></div>
<div class="controls"><button id="minus" type="button" aria-label="Menge verringern">−</button><span id="number" class="number">0</span><button id="plus" class="plus" type="button" aria-label="Menge erhöhen">+</button></div>
</div>
</section>
<div id="status" class="status"></div>
</main>
<script>
(function(){
let n=0;
const number=document.getElementById('number');
const status=document.getElementById('status');
function render(){number.textContent=n;status.textContent=n>0?'Ausgewählt: '+n+' Stück':'';}
document.getElementById('plus').addEventListener('click',function(){n++;render();});
document.getElementById('minus').addEventListener('click',function(){n=Math.max(0,n-1);render();});
render();
})();
</script>
</body>
</html>
